admission_boundary:
  allowed_now:
    - workflow_and_interface_pattern_reuse
    - sanitized_low_temperature_test_fixture
    - independent_algorithm_structure_review
    - visualization_and_workspace_build_pattern
  prohibited_now:
    - HP_298K_1p05_to_14bara_calculation
    - PVPS_warm_compression_calculation
    - QPS_acceptance_or_compliance_evidence
    - HEPAK_or_REFPROP_identity_claim
    - replacing_CoolProp_or_HEPAK_receipts
    - extrapolation_outside_explicit_fit_domain

N_version_role:
  tier: EXPERIMENTAL_N3
  N1: governed_QPS_child_calculation_or_HEPAK_when_available
  N2: CoolProp_exact_revision_receipt
  N3: cryogenic_accelerator_workspace_local_approximation_after_cross_validation
  promotion_gate: >-
    Define exact source data and fit error, verify pressure dependence or formally constrain pressure, reproduce at least
    ten independent state points against an accepted reference, publish residuals/tolerance, then seek child admission.

cross_pollination:
  import_from_QPS_mesh:
    - source_pointer_and_digest_discipline
    - evidence_class
    - no_unknown_zero_fill
    - child_only_promotion
  export_to_QPS_mesh:
    - SSOT_to_physics_to_HMI_regeneration_pattern
    - workspace_bundle_and_manifest_pattern
    - visual_validation_surface
  consumer: GBOGEB/ABACUS
  semantic_route: GBOGEB/CODEX
  no_short_circuit: true

first_red_findings:
  - id: CW-W111-01
    finding: property_engine_pressure_argument_is_not_used_by_existing_polynomial
