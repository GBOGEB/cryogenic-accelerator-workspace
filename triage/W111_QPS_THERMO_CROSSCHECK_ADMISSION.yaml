    disposition: QUARANTINE_GENERAL_THERMO_USE
  - id: CW-W111-02
    finding: source_comment_conflates_NIST_SRD23_and_HEPAK_identity
    consequence: provenance_must_be_recovered_before_property_authority_claim
    disposition: RETAIN_AS_UNVERIFIED_PROVENANCE

DoD:
