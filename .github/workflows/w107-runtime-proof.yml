name: W107 Bridge Runtime Proof

on:
  pull_request:
    paths:
      - "federation/w107/**"
      - ".github/workflows/w107-runtime-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-bridge-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute bridge/RTM runtime twice
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$ACTUAL_SHA"
          mkdir -p /tmp/w107
          python level1/runtime.py orchestrate > /tmp/w107/bridge-a.json
          python level1/runtime.py orchestrate > /tmp/w107/bridge-b.json
          cmp /tmp/w107/bridge-a.json /tmp/w107/bridge-b.json
          python level1/runtime.py self-test > /tmp/w107/self-test.json
          python - <<'PY'
          import json
          o=json.load(open('/tmp/w107/bridge-a.json',encoding='utf-8'))
          s=json.load(open('/tmp/w107/self-test.json',encoding='utf-8'))
          assert o['status']=='READY'
          assert s['status']=='PASS'
          PY
          BRIDGE_SHA="$(sha256sum /tmp/w107/bridge-a.json | awk '{print $1}')"
          SELF_SHA="$(sha256sum /tmp/w107/self-test.json | awk '{print $1}')"
          SOURCE_CONTRACT=MIP/FEDERATION_ACTIVITY.yaml
          TARGET_RECEIPT=federation/w107/W107_CHILD_ACCEPT_RECEIPT_849.yaml
          test -s "$SOURCE_CONTRACT"
          test -s "$TARGET_RECEIPT"
          SOURCE_DIGEST="$(sha256sum "$SOURCE_CONTRACT" | awk '{print $1}')"
          TARGET_DIGEST="$(sha256sum "$TARGET_RECEIPT" | awk '{print $1}')"
          python - <<PY
          import json
          payload={
            'schema_version':'w107-satellite-runtime-proof/0.1',
            'satellite':'GBOGEB/cryogenic-accelerator-workspace',
            'source_sha':'$SOURCE_SHA','actual_sha':'$ACTUAL_SHA',
            'capability':'accelerator_bridge_RTM_evidence_worker',
            'bridge_execution':'PASS','self_test':'PASS','deterministic_repeat':True,
            'source_contract_sha256':'$SOURCE_DIGEST','target_child_receipt_sha256':'$TARGET_DIGEST',
            'bridge_output_sha256':'$BRIDGE_SHA','self_test_sha256':'$SELF_SHA',
            'disposition':'ACCEPT_RUNTIME_EXECUTION',
            'guards':['bridge_does_not_self_promote_QPS_authority','no_compliance_or_negotiation_credit']
          }
          with open('/tmp/w107/W107_RUNTIME_PROOF.json','w',encoding='utf-8') as f:
            json.dump(payload,f,indent=2,sort_keys=True); f.write('\n')
          PY
          cat /tmp/w107/W107_RUNTIME_PROOF.json
      - name: Upload bridge proof
        uses: actions/upload-artifact@v4
        with:
          name: w107-bridge-runtime-proof
          path: |
            /tmp/w107/W107_RUNTIME_PROOF.json
            /tmp/w107/bridge-a.json
            /tmp/w107/self-test.json
          if-no-files-found: error
