name: W111 QPS Thermo Crosscheck Admission

on:
  pull_request:
    paths:
      - 'triage/W111_QPS_THERMO_CROSSCHECK_ADMISSION.yaml'
      - 'src/qps_w111_property_adapter.py'
      - '.github/workflows/w111-qps-thermo-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Execute narrow property-engine admission guard
        run: PYTHONPATH=src python src/qps_w111_property_adapter.py
      - name: Prove warm HP state is rejected by legacy polynomial adapter
        run: |
          PYTHONPATH=src python -c "from qps_w111_property_adapter import QuarantinedHeliumPropertyAdapter as A; a=A();
          import sys;
          
          try:
              a.get_enthalpy_j_g(298.0,1.05)
          except ValueError:
              print('W111_WARM_HP_QUARANTINE=PASS'); sys.exit(0)
          raise SystemExit('legacy polynomial unexpectedly admitted warm HP state')"
