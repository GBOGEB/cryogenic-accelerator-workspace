name: W111 QPS Thermo Crosscheck Admission

on:
  pull_request:
    paths:
      - 'triage/W111_QPS_THERMO_CROSSCHECK_ADMISSION.yaml'
      - 'src/qps_w111_property_adapter.py'
      - 'src/qps_w111_mass_balance_guard.py'
      - 'src/physics_validator.py'
      - 'config/engineering_data.yaml'
      - '.github/workflows/w111-qps-thermo-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-guard:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install narrow guard dependencies
        run: python -m pip install 'numpy==2.5.3' 'PyYAML==6.0.2'
      - name: Execute narrow property-engine admission guard
        run: PYTHONPATH=src python src/qps_w111_property_adapter.py
      - name: Execute mass-balance dimensional guard
        run: PYTHONPATH=src python src/qps_w111_mass_balance_guard.py
