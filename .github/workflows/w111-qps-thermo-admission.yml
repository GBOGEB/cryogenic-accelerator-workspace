name: W111 QPS Thermo Crosscheck Admission

on:
  pull_request:
    paths:
      - 'triage/W111_QPS_THERMO_CROSSCHECK_ADMISSION.yaml'
      - 'src/qps_w111_property_adapter.py'
      - '.github/workflows/w111-qps-thermo-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Execute narrow property-engine admission guard
        run: PYTHONPATH=src python src/qps_w111_property_adapter.py
